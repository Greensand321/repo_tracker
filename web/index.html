<!DOCTYPE html>
<!--
  The page shell — the Broadsheet (D54, D57).

  A masthead, a leader column, and a standing register down the side. Almost everything
  below is an empty mount point: the page renders one Snapshot and computes nothing of
  its own (rule 4), so the structure lives in main.ts rather than here.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bearing</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="sheet">
  <div class="masthead">
    <div class="word">Bearing</div>
    <div class="rule-line" id="ruleLine"></div>
  </div>

  <div class="dateline">
    <span id="dateLeft"></span>
    <span class="right">
      <span id="dateRight"></span>
      <button id="refreshNow">Read again</button>
      <button id="openSettings">Settings</button>
    </span>
  </div>

  <div class="cols">
    <main class="leader">
      <div id="firstRun" class="hidden"></div>
      <section id="brief" class="brief"></section>
      <section id="nowBand" class="nowband"></section>
      <div class="leader-head" id="leaderHead"></div>
      <div id="leaderList"></div>
    </main>

    <aside class="side">
      <div class="stand">
        <h3>Ask the advisor</h3>
        <div class="ask">
          <textarea id="askBox" placeholder="What moved while I was away?" rows="2"></textarea>
          <div class="row">
            <span class="hint" id="askHint"></span>
            <button class="thread hidden" id="newThread" title="Forget what was said and start a fresh conversation. Nothing else changes.">new thread</button>
            <button class="go" id="askGo">Ask ⏎</button>
          </div>
        </div>
        <div id="answers"></div>
      </div>

      <div class="stand">
        <h3>The floor <span class="n" id="floorCount"></span></h3>
        <div id="floor"></div>
      </div>

      <div class="stand">
        <h3>The register <span class="n" id="registerCount"></span><button id="newGoal">+ goal</button></h3>
        <div id="register"></div>
      </div>

      <div class="stand">
        <h3>Waiting on you <button id="describeMany">+ describe several</button></h3>
        <div id="questions"></div>
      </div>

      <div class="stand">
        <h3>Conditions</h3>
        <div class="weather" id="conditions"></div>
      </div>

      <div class="stand">
        <h3>Notices</h3>
        <div id="notices"></div>
      </div>
    </aside>
  </div>
</div>

<div id="filing"></div>
<div id="proposals"></div>

<div class="sheet-modal hidden" id="settingsSheet">
  <div class="panel">
    <div class="top">
      <h2>Settings</h2>
      <p class="lede">Reads your repos, never writes to them. Goals, notes and settings stay on this machine.</p>
    </div>

    <div class="settings-grid">
      <div class="col">
        <div class="eyebrow">GitHub</div>

        <div class="field">
          <label for="token">Token
            <span class="info" tabindex="0" role="img" aria-label="about the token" data-tip="A fine-grained, read-only token. Under Repository permissions set Metadata, Contents, Pull requests and Actions to Read-only — plus Commit statuses if your CI is not GitHub Actions. Nothing under Account; there is no Checks option for these tokens. Kept in data/settings.json on this machine and sent nowhere but GitHub.">i</span>
            <a class="beside" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer noopener">create one &#8599;</a>
          </label>
          <input id="token" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
        </div>

        <div class="field">
          <label for="repos">Repositories
            <span class="info" tabindex="0" role="img" aria-label="about repositories" data-tip="One owner/name per line. Every branch in each of them appears here.">i</span>
          </label>
          <textarea id="repos" spellcheck="false" placeholder="greensand321/repo_tracker" rows="6"></textarea>
        </div>

        <div class="field nums">
          <div>
            <label for="refreshSeconds">Read every (s)
              <span class="info" tabindex="0" role="img" aria-label="about reading" data-tip="Seconds between background reads of GitHub. A repo that has not moved costs nothing. 0 turns background reading off.">i</span>
            </label>
            <input id="refreshSeconds" type="number" min="0" max="3600" step="10">
          </div>
          <div>
            <label for="quietAfterDays">Quiet after (d)
              <span class="info" tabindex="0" role="img" aria-label="about quiet branches" data-tip="Days without a commit before a branch folds away as quiet. It is never deleted.">i</span>
            </label>
            <input id="quietAfterDays" type="number" min="1" max="365">
          </div>
          <div>
            <label for="commitsPerBranch">Commits kept
              <span class="info" tabindex="0" role="img" aria-label="about commits" data-tip="How much history is kept per branch, and how much a summary may read.">i</span>
            </label>
            <input id="commitsPerBranch" type="number" min="1" max="300">
          </div>
        </div>
      </div>

      <div class="col right">
        <div class="eyebrow">The advisor
          <span class="info" tabindex="0" role="img" aria-label="about the advisor" data-tip="Writes the plain-English headline on each branch, judges each against what it is for, writes the brief, and answers questions. Optional: leave the key blank and everything else still works.">i</span>
        </div>

        <div class="field two">
          <div>
            <label for="llmApiKey">API key
              <span class="info" tabindex="0" role="img" aria-label="about the key" data-tip="Kept on this machine only, next to the GitHub token. Leave blank to keep the current one.">i</span>
            </label>
            <input id="llmApiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
          </div>
          <div>
            <label for="llmProvider">Provider
              <span class="info" id="providerHint" tabindex="0" role="img" aria-label="about the provider" data-tip="">i</span>
            </label>
            <select id="llmProvider">
              <option value="https://opencode.ai/zen/go/v1">OpenCode Go — subscription</option>
              <option value="https://opencode.ai/zen/v1">OpenCode Zen — pay as you go</option>
              <option value="custom">Other OpenAI-compatible…</option>
            </select>
          </div>
        </div>
        <div class="field hidden" id="endpointField">
          <label for="llmBaseUrl">Endpoint</label>
          <input id="llmBaseUrl" type="text" spellcheck="false" placeholder="https://…/v1">
        </div>

        <div class="field">
          <label>Model
            <span class="info" tabindex="0" role="img" aria-label="about the model" data-tip="Pick one from the provider's own list, loaded once the key is saved. A model your plan cannot reach says so the first time it is used.">i</span>
          </label>
          <div class="model-row">
            <div id="modelPicker"></div>
            <button class="btn small" id="loadModels" type="button">Load the list</button>
          </div>
        </div>

        <div class="field nums four">
          <div>
            <label for="llmMaxPerRun">Calls per read
              <span class="info" tabindex="0" role="img" aria-label="about the call budget" data-tip="The most provider calls one read may make — every job and every lookup. Work left over waits for the next read.">i</span>
            </label>
            <input id="llmMaxPerRun" type="number" min="0" max="500">
          </div>
          <div>
            <label for="llmReplyTokens">Reply tokens
              <span class="info" tabindex="0" role="img" aria-label="about reply room" data-tip="How long one reply may run. A cap, not a target: a plain model uses a few hundred and the rest costs nothing. A reasoning model thinks out of the same allowance and, capped too low, returns nothing — “the model returned an empty reply”. A reply that hits the cap is tried once more with double the room.">i</span>
            </label>
            <input id="llmReplyTokens" type="number" min="256" max="32000" step="100">
          </div>
          <div>
            <label for="askBranchCap">Branches
              <span class="info" tabindex="0" role="img" aria-label="about the question size" data-tip="How much of the register a question may put in front of the model. Every question grows with it.">i</span>
            </label>
            <input id="askBranchCap" type="number" min="1" max="400">
          </div>
          <div>
            <label for="maxOpenQuestions">Questions
              <span class="info" tabindex="0" role="img" aria-label="about questions" data-tip="How many may wait for you at once. A wall of them is a chore list. 0 switches them off.">i</span>
            </label>
            <input id="maxOpenQuestions" type="number" min="0" max="40">
          </div>
        </div>

        <div class="field nums">
          <div>
            <label for="advisorMemoryMinutes">Memory
              <span class="info" tabindex="0" role="img" aria-label="about the advisor's memory" data-tip="Minutes of quiet before the advisor forgets the conversation, so a follow-up like “and that one?” still means something. Nothing is held open between questions — this only decides how much of what was said is sent again, a few hundred tokens a turn. 0 starts every question clean.">i</span>
            </label>
            <input id="advisorMemoryMinutes" type="number" min="0" max="1440">
          </div>
          <div>
            <label for="briefEveryMinutes">Brief
              <span class="info" tabindex="0" role="img" aria-label="about the brief" data-tip="Minutes between routine rewrites of the brief — it reads every branch, so it is the dearest call. The last one stays up, dated, until then. “Write it again” never waits. 0 rewrites every read.">i</span>
            </label>
            <input id="briefEveryMinutes" type="number" min="0" max="1440">
          </div>
          <div>
            <label for="nowLineWords">Line words
              <span class="info" tabindex="0" role="img" aria-label="about the line" data-tip="The most words “happening now” may use — it says “Done.” in one. The assistant is told the number, and a longer tail is trimmed rather than wrapped. Shorten it and the summaries are rewritten to fit.">i</span>
            </label>
            <input id="nowLineWords" type="number" min="5" max="20">
          </div>
        </div>

        <div class="field nums">
          <div>
            <label for="workers">Jobs
              <span class="info" tabindex="0" role="img" aria-label="about workers" data-tip="How many background jobs run at once. Watch them on The floor.">i</span>
            </label>
            <input id="workers" type="number" min="1" max="8">
          </div>
          <div>
            <label for="dispatchWorkers">Asked
              <span class="info" tabindex="0" role="img" aria-label="about the dispatched lane" data-tip="How many jobs you asked for run at once — its own lane, so what you ask for never queues behind background work.">i</span>
            </label>
            <input id="dispatchWorkers" type="number" min="1" max="8">
          </div>
          <div>
            <label for="toolCallsPerJob">Lookups
              <span class="info" tabindex="0" role="img" aria-label="about lookups" data-tip="Lookups one job may make before answering. A ceiling, not a target. 0 is the same as turning lookups off.">i</span>
            </label>
            <input id="toolCallsPerJob" type="number" min="0" max="20">
          </div>
        </div>

        <div class="check">
          <input id="visionAutoDraft" type="checkbox">
          <label for="visionAutoDraft">Propose what each branch is for</label>
          <span class="info" tabindex="0" role="img" aria-label="about proposals" data-tip="Only where it can be specific — a purpose nothing could contradict is worthless as a yardstick, so it says nothing rather than padding. Proposals stay marked until you confirm them.">i</span>
        </div>
        <div class="check">
          <input id="toolsEnabled" type="checkbox">
          <label for="toolsEnabled">Look things up before answering</label>
          <span class="info" tabindex="0" role="img" aria-label="about lookups" data-tip="A station may read the README, what a commit touched, the branches next to it and what moved this week, instead of inferring all of it from commit messages. A call or two more per branch. Also what lets the advisor start work. Switching it regenerates judgements, which were drawn from different evidence.">i</span>
        </div>
      </div>
    </div>

    <div class="err" id="settingsErr"></div>
    <div class="actions">
      <button class="btn primary" id="saveSettings">Save and read again</button>
      <button class="btn" id="closeSettings">Close</button>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
