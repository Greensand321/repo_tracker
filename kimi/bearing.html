<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bearing — you are here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0f14; --panel:#121922; --panel-2:#161f2a; --panel-3:#1a2431;
  --line:#212c38; --line-2:#2d3a48;
  --text:#eae7e0; --dim:#93a0af; --faint:#5d6979;
  --brass:#d8a54a; --brass-2:#f2c976; --sage:#68c293; --coral:#e2705f; --sky:#74a8e0; --violet:#a98bdb;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--ink); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden}
body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(1100px 620px at 78% -12%, rgba(216,165,74,.09), transparent 62%),
             radial-gradient(900px 560px at -12% 112%, rgba(116,168,224,.06), transparent 60%)}
::selection{background:rgba(216,165,74,.28)}
code{font-family:var(--mono); font-size:.86em; color:#cdd7e3}
button{font-family:inherit; color:inherit; cursor:pointer}
.hidden{display:none !important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#243040;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{position:relative; z-index:1; display:flex; flex-direction:column; height:100vh}

.topbar{height:58px; flex:none; display:flex; align-items:center; gap:18px; padding:0 24px; border-bottom:1px solid var(--line);
  background:rgba(11,15,20,.72); backdrop-filter:blur(10px)}
.brand{display:flex; align-items:center; gap:11px; flex:none}
.brand .mark{width:27px;height:27px;color:var(--brass);filter:drop-shadow(0 0 10px rgba(216,165,74,.35))}
.brand .word{font-family:var(--serif); font-size:23px; line-height:1}
.brand .word b{font-weight:400}
.brand .sub{font-family:var(--mono); font-size:9.5px; color:var(--faint); letter-spacing:.22em; text-transform:uppercase; margin-top:1px}
.cmd{flex:1; max-width:620px; height:38px; display:flex; align-items:center; gap:10px; padding:0 13px;
  border:1px solid var(--line); border-radius:11px; background:linear-gradient(180deg,var(--panel-2),var(--panel)); color:var(--faint); font-size:13px}
.cmd:hover{border-color:rgba(216,165,74,.4); color:var(--dim)}
.cmd .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cmd .txt code{color:#c9d4e1; background:rgba(255,255,255,.05); border:1px solid var(--line); padding:1px 6px; border-radius:5px; font-size:11.5px}
.cmd .k{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:2px 6px; flex:none}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;
  color:#221a08;background:linear-gradient(140deg,var(--brass-2),var(--brass));border:1px solid rgba(255,255,255,.18); margin-left:auto}

.scope{flex:none; display:flex; align-items:center; gap:14px; padding:9px 24px; border-bottom:1px solid var(--line);
  background:rgba(11,15,20,.5); overflow-x:auto; scrollbar-width:none}
.scope::-webkit-scrollbar{display:none}
.proj-tabs{display:flex; align-items:center; gap:5px}
.ptab{display:flex; align-items:center; gap:8px; height:31px; padding:0 13px; border-radius:9px; border:1px solid transparent;
  color:var(--dim); font-size:12.5px; font-weight:500; white-space:nowrap; background:transparent}
.ptab:hover{color:var(--text); background:rgba(255,255,255,.035)}
.ptab.active{color:var(--text); background:rgba(216,165,74,.10); border-color:rgba(216,165,74,.24)}
.ptab .pdot{width:8px;height:8px;border-radius:3px;flex:none}
.ptab .n{font-family:var(--mono); font-size:10.5px; color:var(--faint)}
.ptab.active .n{color:var(--brass-2)}
.vtabs{margin-left:auto; display:flex; gap:3px; padding:3px; border:1px solid var(--line); border-radius:12px; background:rgba(9,13,18,.55); flex:none}
.vtab{height:28px; padding:0 13px; border-radius:9px; border:none; background:transparent; color:var(--dim); font-size:12.5px; font-weight:500;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap}
.vtab:hover{color:var(--text)}
.vtab.active{background:linear-gradient(180deg,var(--panel-3),var(--panel-2)); color:var(--text); box-shadow:0 1px 0 rgba(255,255,255,.05), 0 6px 14px -10px #000}
.vtab .badge{font-family:var(--mono); font-size:10px; color:var(--coral); background:rgba(226,112,95,.12); border:1px solid rgba(226,112,95,.3); padding:0 5px; border-radius:10px}

.dashboard{flex:1; overflow-y:auto; min-height:0}
.dash-inner{max-width:1560px; margin:0 auto; padding:22px 32px 100px}
.board-head{display:flex; align-items:baseline; gap:14px; margin-bottom:16px}
.counts{font-size:12.5px; color:var(--faint)}
.counts b{color:var(--dim); font-weight:600}

/* ---------- branch cards ---------- */
.board{display:grid; grid-template-columns:repeat(auto-fit,minmax(500px,1fr)); gap:14px; align-items:start}
.branch{
  position:relative; border:1px solid var(--line); border-radius:16px; overflow:hidden;
  background:linear-gradient(180deg,var(--panel-2),var(--panel)); cursor:pointer; transition:border-color .15s, box-shadow .15s, transform .15s;
}
.branch::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--edge)}
.branch:hover{border-color:var(--line-2); box-shadow:0 22px 40px -30px #000}
.branch.needs{background:linear-gradient(180deg,#1b2431,#141c25)}
.branch.open{border-color:rgba(216,165,74,.45); box-shadow:0 26px 50px -30px #000}
.branch.sel{border-color:rgba(216,165,74,.6); box-shadow:0 0 0 1px rgba(216,165,74,.22), 0 26px 50px -30px #000}
.branch.stale{opacity:.82}
.b-head{display:flex; align-items:center; gap:7px; padding:13px 18px 0; font-family:var(--mono); font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.b-dot{width:7px;height:7px;border-radius:2px;flex:none}
.b-proj{color:var(--dim)}
.b-sep{opacity:.5}
.b-path{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.b-age{margin-left:auto; display:flex; align-items:center; gap:7px; letter-spacing:0; padding-left:10px}
.b-chev{flex:none; color:var(--faint); display:grid; place-items:center; transition:transform .3s cubic-bezier(.4,0,.2,1)}
.b-chev svg{width:14px;height:14px}
.branch.open .b-chev{transform:rotate(180deg); color:var(--brass-2)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--brass);position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--brass);opacity:.6;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}

.b-main{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:22px; padding:11px 18px 14px; align-items:center}
.b-name{font-family:var(--serif); font-weight:400; font-size:25px; line-height:1.02; margin:0 0 7px; letter-spacing:.005em}
.b-feature{display:flex; align-items:center; gap:9px; font-size:13.5px; color:#c9cfd8; margin-bottom:10px}
.tag{font-family:var(--mono); font-size:8.5px; font-weight:600; letter-spacing:.14em; padding:3px 7px; border-radius:5px; flex:none;
  border:1px solid var(--line-2); color:var(--dim); background:rgba(255,255,255,.03)}
.tag.warn{color:var(--brass-2); border-color:rgba(216,165,74,.35); background:rgba(216,165,74,.09)}
.tag.bad{color:var(--coral); border-color:rgba(226,112,95,.35); background:rgba(226,112,95,.09)}
.tag.ok{color:var(--sage); border-color:rgba(104,194,147,.35); background:rgba(104,194,147,.09)}
.tag.dim{color:var(--faint)}
.b-activity{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.heat{display:flex; align-items:stretch; gap:3px; height:20px; flex:1; min-width:0; max-width:340px}
.heat i{flex:1; min-width:3px; border-radius:2px; background:rgba(255,255,255,.045); border:1px solid transparent}
.heat i.on{background:var(--c); border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.heat i.now{box-shadow:0 0 8px -1px var(--c)}
.b-act{font-family:var(--mono); font-size:10px; color:var(--faint); white-space:nowrap}
.b-note{font-size:12.5px; color:var(--dim); font-style:italic; line-height:1.4}
.b-note.hot{color:var(--brass-2); font-style:normal}
.b-right{display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; width:78px}
.ring{display:block}
.ring-fill{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.ring-num{font-family:var(--sans); font-size:15px; font-weight:700; fill:var(--text)}
.b-rlabel{font-size:10px; color:var(--faint); letter-spacing:.06em}
.b-steps{font-family:var(--mono); font-size:9.5px; color:var(--dim); text-align:center}

/* expand */
.b-expand{display:grid; grid-template-rows:0fr; transition:grid-template-rows .34s cubic-bezier(.4,0,.2,1)}
.branch.open .b-expand{grid-template-rows:1fr}
.b-expand-inner{overflow:hidden; min-height:0}
.ex-wrap{border-top:1px solid var(--line); margin:0 18px; padding:16px 0 18px}
.ex-grid{display:grid; grid-template-columns:1fr 1fr; gap:26px}
.ex-h{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-bottom:11px}
.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.steps li{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--dim)}
.steps li.done{color:var(--faint)}
.steps li.done .chk{color:var(--sage)}
.chk{width:14px; height:14px; flex:none; display:grid; place-items:center; font-size:11px; color:var(--faint)}
.log{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
.log li{display:flex; gap:12px; font-size:12px; color:var(--dim)}
.log .when{font-family:var(--mono); font-size:10px; color:var(--faint); flex:none; width:74px; padding-top:1px}
.log .what{color:#c9cfd8}
.ex-actions{display:flex; align-items:center; gap:10px; margin-top:18px}
.btn{height:36px; padding:0 15px; border-radius:10px; border:1px solid var(--line-2); background:linear-gradient(180deg,var(--panel-3),var(--panel));
  font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:8px; color:var(--text)}
.btn:hover{border-color:#3d4c5d}
.btn.primary{background:linear-gradient(180deg,var(--brass-2),var(--brass)); color:#241a06; border-color:rgba(255,255,255,.2)}
.btn.ghost{background:transparent; border-color:var(--line); color:var(--dim)}
.btn.ghost:hover{color:var(--text)}
.ex-commits{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--faint)}

/* timeline + notes (depth views) */
.axis{display:grid; grid-template-columns:210px 1fr; margin-bottom:6px}
.axis .ticks{position:relative; height:14px}
.axis .ticks span{position:absolute; top:0; font-family:var(--mono); font-size:9.5px; color:var(--faint); transform:translateX(-50%)}
.axis .ticks span:first-child{transform:none}
.axis .ticks span:last-child{transform:translateX(-100%)}
.strands-rows{display:flex; flex-direction:column}
.srow{display:grid; grid-template-columns:210px 1fr; align-items:center; height:56px; border-top:1px solid rgba(33,44,56,.5)}
.srow:first-child{border-top:none}
.slabel{padding-right:14px; min-width:0}
.slabel .sname{font-family:var(--serif); font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.15}
.slabel .spath{font-family:var(--mono); font-size:9.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.slane{position:relative; height:100%}
.slane::before{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(33,44,56,.7)}
.stoday{position:absolute; top:0; bottom:0; width:1px; background:linear-gradient(180deg,transparent,var(--brass),transparent); opacity:.5}
.dot{position:absolute; top:50%; width:9px; height:9px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px rgba(11,15,20,.9); cursor:help}
.dot.big{width:12px;height:12px}
.span-bar{position:absolute; top:50%; height:5px; transform:translateY(-50%); border-radius:3px; opacity:.28}
.srow.faded{opacity:.5}
.legend{display:flex; gap:14px; justify-content:flex-end; font-size:10.5px; color:var(--faint); margin-bottom:14px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:15px; padding:18px}
.section-title{display:flex; align-items:baseline; gap:12px; margin:0 0 16px}
.section-title h3{font-family:var(--serif); font-weight:400; font-size:23px; margin:0}
.section-title span{color:var(--faint); font-size:12px}
.notes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px}
.note-card{border:1px solid var(--line); border-radius:14px; padding:17px; background:linear-gradient(180deg,var(--panel-2),var(--panel)); cursor:pointer; transition:.15s}
.note-card:hover{transform:translateY(-2px); border-color:var(--line-2)}
.note-card .nc-top{display:flex; align-items:center; gap:8px; margin-bottom:11px; font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
.note-card .nc-top .pdot{width:7px;height:7px;border-radius:2px}
.note-card .nc-top .age{margin-left:auto}
.note-card .q{font-family:var(--serif); font-size:22px; line-height:1.15; margin:0 0 10px}
.note-card .body{font-size:12.5px; color:var(--dim); margin:0 0 13px; line-height:1.5}
.note-card .nc-meta{display:flex; align-items:center; gap:9px; padding-top:11px; border-top:1px solid var(--line); font-family:var(--mono); font-size:10px; color:var(--faint)}
.empty{border:1px dashed var(--line-2); border-radius:12px; padding:30px; text-align:center; color:var(--faint); font-size:12.5px}

/* palette */
.palette-layer{position:fixed; inset:0; z-index:60; display:flex; justify-content:center; align-items:flex-start; padding:80px 20px 24px;
  background:rgba(6,9,13,.62); opacity:0; pointer-events:none; transition:.18s}
body.palette-open .palette-layer{opacity:1; pointer-events:auto; backdrop-filter:blur(7px)}
.palette{width:100%; max-width:700px; border-radius:19px; border:1px solid rgba(216,165,74,.34); background:linear-gradient(180deg,#151d27,#0f151d);
  display:flex; flex-direction:column; overflow:hidden; max-height:calc(100vh - 130px); box-shadow:0 50px 110px -40px #000;
  transform:translateY(-12px) scale(.985); transition:.2s cubic-bezier(.4,0,.2,1)}
body.palette-open .palette{transform:none}
.p-head{padding:16px 18px 14px; border-bottom:1px solid var(--line)}
.p-row{display:flex; align-items:center; gap:11px}
.p-row .mark{width:19px;height:19px;color:var(--brass);flex:none}
.p-row input{flex:1; border:none; background:transparent; color:var(--text); font-family:inherit; font-size:15px; outline:none; padding:4px 0}
.p-row input::placeholder{color:var(--faint)}
.p-esc{font-family:var(--mono); font-size:10px; color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:3px 7px; flex:none}
.p-ctx{margin-top:12px; display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--faint); border:1px solid var(--line);
  background:rgba(9,13,18,.5); border-radius:9px; padding:7px 10px}
.p-ctx code{color:#cbd6e3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.p-ctx .pdot{width:7px;height:7px;border-radius:2px;flex:none}
.p-chips{display:flex; flex-wrap:wrap; gap:7px; padding:13px 18px; border-bottom:1px solid var(--line)}
.chip{font-size:11.5px; color:var(--dim); border:1px solid var(--line); background:rgba(255,255,255,.03); padding:5px 11px; border-radius:20px}
.chip:hover{border-color:rgba(216,165,74,.45); color:var(--brass-2); background:rgba(216,165,74,.07)}
.p-thread{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px; min-height:80px}
.msg{max-width:100%; font-size:13px; line-height:1.6}
.msg.user{align-self:flex-end; max-width:86%; background:linear-gradient(180deg,var(--panel-3),var(--panel-2)); border:1px solid var(--line-2);
  border-radius:12px 12px 3px 12px; padding:9px 13px}
.msg.bot .who{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase; color:var(--brass); font-weight:600; margin-bottom:7px}
.msg.bot .who .mark{width:13px;height:13px}
.msg.bot p{margin:0 0 9px; color:#cdd4dd}
.msg.bot p:last-child{margin-bottom:0}
.msg.bot code{color:#9cc4ec; background:rgba(116,168,224,.1); border:1px solid rgba(116,168,224,.22); padding:0 5px; border-radius:4px}
.msg.bot .cite{margin-top:10px; padding-top:9px; border-top:1px dashed var(--line); font-size:10.5px; color:var(--faint); font-family:var(--mono); display:flex; gap:7px; flex-wrap:wrap}
.msg.bot .cite b{color:var(--dim)}
.p-foot{padding:11px 18px; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; font-size:11px; color:var(--faint)}

.fab{position:fixed; right:26px; bottom:24px; z-index:30; display:flex; align-items:center; gap:10px; height:45px; padding:0 17px; border-radius:26px;
  border:1px solid rgba(216,165,74,.42); background:linear-gradient(180deg,rgba(216,165,74,.2),rgba(15,21,29,.96)); color:var(--brass-2);
  font-size:13px; font-weight:600; box-shadow:0 20px 44px -20px #000; transition:.16s}
.fab:hover{transform:translateY(-2px); border-color:rgba(216,165,74,.7)}
.fab .mark{width:17px;height:17px}
.fab kbd{font-family:var(--mono); font-size:9.5px; border:1px solid rgba(216,165,74,.35); border-radius:6px; padding:2px 6px; color:var(--brass)}
.toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(10px); z-index:70; background:linear-gradient(180deg,var(--panel-3),var(--panel-2));
  border:1px solid rgba(216,165,74,.4); font-size:12.5px; padding:11px 16px; border-radius:11px; opacity:0; transition:.2s; box-shadow:0 20px 44px -20px #000;
  pointer-events:none; display:flex; align-items:center; gap:9px}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast .mark{width:15px;height:15px;color:var(--brass)}

@media (max-width:1080px){ .board{grid-template-columns:1fr} .dash-inner{padding:22px 20px 100px} }
@media (max-width:900px){ .ex-grid{grid-template-columns:1fr; gap:18px} .axis,.srow{grid-template-columns:150px 1fr} .vtabs .vtab span.lbl{display:none} }
@media (max-width:640px){ .cmd{display:none} .topbar,.scope{padding-left:15px; padding-right:15px} .dash-inner{padding:18px 14px 110px} .b-main{grid-template-columns:1fr; gap:14px} .b-right{flex-direction:row; width:auto; gap:10px} .fab{right:16px; bottom:16px} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="compass" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
    <circle cx="16" cy="16" r="9.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".3"/>
    <path d="M16 4.5 L19 16 L16 27.5 L13 16 Z" fill="currentColor"/>
    <circle cx="16" cy="16" r="1.9" fill="#0b0f14"/>
  </symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="mark"><use href="#compass"/></svg>
      <div><div class="word"><b>Bearing</b></div><div class="sub">you are here</div></div>
    </div>
    <button class="cmd" id="cmdSearch">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="txt">Ask about <code id="cmdCtx">feat-onboarding</code> — or jump anywhere</span>

</div>

<script>
/* ------------------------------------------------------------------
   Seven branches. For each: the feature in flight, the steps between
   here and main, and the days you actually touched it.
------------------------------------------------------------------- */
const PROJECTS = {
  ledger:{name:"Ledger", color:"#d8a54a"},

const BRANCHES = {
  onboarding:{

  },
  retry:{
    project:"Ledger", projectKey:"ledger", path:"feat-stripe-webhooks", name:"the retry problem",
    note:"\u201cdedupe table first\u201d", noteHot:true, age:"2h", rank:1, status:"active", ci:"pass", needs:false,
    feature:"Idempotent webhook handling", commits:23, days:[4,5,9,12,13,17,18,20,21,26,27],
    steps:[["Signature verification",true],["Replay the failing event locally",true],["Rebased on main",true],
           ["Dedupe the event row",false],["Idempotency test green",false],["CI green",false]],
    log:[["today 14:32","Wrote the failing idempotency test"],["today 14:02","Signature verification landed"],
         ["today 13:40","Reproduced the duplicate retry"],["Mon","Webhook scaffolding"]],
    recall:"You were chasing duplicate webhook events. Signature verification landed, then Stripe's retries kept double-writing the event row. You wrote a failing test at webhooks/idempotency.spec.ts:48 and stopped.",
    blocker:"The handler writes the event row before it checks event.id, so a retry double-writes before your dedupe runs. The check has to move ahead of the insert.",

  },
  parser:{
    project:"Drift", projectKey:"drift", path:"refactor-parser", name:"the parser rewrite",
    note:"\u201cstreaming tokenizer works!\u201d", noteHot:true, age:"2d", rank:2, status:"uncommitted", ci:"none", needs:true,
    feature:"Streaming parser rewrite", commits:18, days:[11,12,16,17,18,19,20,22,23,24,25,26],
    steps:[["Tokenizer streams, no buffering",true],["Call sites rewired",true],["Commit the work",false],["Local tests pass",false],["Rebased on main",false]],
    log:[["Thu 18:41","Last edit \u2014 tokenizer call sites"],["Thu 17:55","Rewired 14 files"],["Thu 16:10","Streaming tokenizer working"],["Wed","Spike on a streaming design"]],
    recall:"Fourteen files, 380 insertions \u2014 never committed. You were rewiring the tokenizer to stream instead of buffering, and the last edit was Thursday evening.",
    blocker:"Nothing is committed. One stray reset or a bad rebase and two days of the parser rewrite are gone.",
    next:"Commit it now, even as a WIP branch, before anything else. Then split the tokenizer change from the call-site rewiring."
  },
  rounding:{
    project:"Ledger", projectKey:"ledger", path:"fix-rounding", name:"the rounding bug",
    note:"\u201coff by a cent\u201d", age:"5d", rank:3, status:"drift", ci:"fail", needs:true,
    feature:"Cent-accurate money math", commits:9, days:[2,3,4,8,9],
    steps:[["Banker's rounding fix",true],["Test the cent case",true],["Self-review",true],["Rebase onto main",false],["Resolve money.ts conflict",false],["CI green",false]],

    recall:"You traced an off-by-a-cent bug to banker's rounding in money.ts, fixed it, and pushed two commits \u2014 then main moved 40 commits ahead and you never came back to rebase.",
    blocker:"You are 40 behind main and main also changed money.ts, so a rebase will conflict. The fix is correct; it needs to land on top of current main.",
    next:"Rebase onto main and resolve the money.ts conflict. Expect three conflicts \u2014 yours is the correct rounding path, theirs is a rename."
  },
  deps:{
    project:"Ledger", projectKey:"ledger", path:"chore-bump-deps", name:"the dependency sweep",
    note:"\u201cnothing broke, surprisingly\u201d", age:"9d", rank:4, status:"drift", ci:"pass", needs:false,
    feature:"Quarterly dependency sweep", commits:12, days:[1,7],
    steps:[["Bump 8 packages",true],["CI green",true],["Self-review",true],["Rebase onto main",false]],
    log:[["9 days ago","CI came back green"],["9 days ago","Bumped 8 packages"],["10 days ago","Opened the sweep branch"]],
    recall:"A routine dependency bump \u2014 eight commits, CI green. You opened it nine days ago and never merged it, and main has since moved again.",
    blocker:"It is twelve behind main now. Nothing is broken, it is just going stale and will start conflicting for no reason.",
    next:"Rebase and merge, or close it. The cheap move is a fresh bump from current main."
  },
  realtime:{
    project:"Halo", projectKey:"halo", path:"spike-realtime", name:"the realtime spike",
    note:"\u201cworth it, but later\u201d", age:"21d", rank:5, status:"stale", ci:"none", needs:true,
    feature:"Realtime sync spike", commits:7, days:[5,6,7],
    steps:[["Spike notes written",true],["Decide: fold in or archive",false],["Fold into onboarding",false],["Archive the branch",false]],
    log:[["3 weeks ago","Wrote the conclusion \u2014 worth it, but later"],["3 weeks ago","Probed the sync model"],["3 weeks ago","Started the websocket spike"]],
    recall:"A three-day spike into websocket sync. Your own note says \u201cworth it, but later\u201d \u2014 and then you never touched it. Quiet for three weeks.",
    blocker:"Nothing is blocked. This is a decision, not a task: fold the idea into the onboarding work, or archive the branch and trust the note.",
    next:"Read your own conclusion, then archive it. Keeping it open costs you a glance every time you open Bearing."
  },
  export:{
    project:"Drift", projectKey:"drift", path:"feat-export-csv", name:"the CSV export",
    note:"\u201cshipped \u2014 done\u201d", age:"3w", rank:6, status:"merged", ci:"merged", needs:false,
    feature:"CSV export", commits:14, days:[6,7,8,9,10],
    steps:[["Export implemented",true],["Edge cases covered",true],["Merged to main",true]],
    log:[["3 weeks ago","Merged into main"],["3 weeks ago","Noted the edge cases"],["3 weeks ago","CSV export branch opened"]],
    recall:"Merged three weeks ago and behaving. Kept because the notes on it are worth re-reading \u2014 the edge cases you found still apply.",
    blocker:"Nothing. This is your archive, not your workload.",
    next:"Nothing to do. If you ever touch exporters again, read this branch's notes first."
  }
};
const ORDER = ["onboarding","retry","parser","rounding","deps","realtime","export"];
const MAXDAY = 28, MOST_RECENT = "onboarding";
const state = { project:"all", view:"board", selected:"onboarding", open:null };

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const inScope = k => state.project==="all" || BRANCHES[k].projectKey===state.project;
const scoped  = () => ORDER.filter(inScope);
const byRank  = (a,b)=>BRANCHES[a].rank-BRANCHES[b].rank;
const projectColor = key => PROJECTS[key].color;
const doneCount = b => b.steps.filter(s=>s[1]).length;
const pct = b => Math.round(doneCount(b)/b.steps.length*100);
const active7 = b => b.days.filter(d=>d>=21).length;

function phase(b){
  if(b.status==="merged") return ["SHIPPED","ok"];
  if(b.status==="stale")  return ["PAUSED","dim"];
  if(b.ci==="fail")       return ["BLOCKED","bad"];
  if(b.uncommitted>0 || b.status==="uncommitted") return ["IN PROGRESS","warn"];
  return ["NOW","warn"];
}
function ringColor(b){
  if(b.status==="merged"||pct(b)===100) return "var(--sage)";
  if(b.ci==="fail") return "var(--coral)";
  return projectColor(b.projectKey);
}
function ringHTML(b){
  const p=pct(b), r=26, c=2*Math.PI*r, off=c*(1-p/100);
  return '<svg class="ring" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="#212c38" stroke-width="6"/>'+
    '<circle class="ring-fill" cx="32" cy="32" r="'+r+'" fill="none" stroke="'+ringColor(b)+'" stroke-width="6" stroke-linecap="round" '+
      'transform="rotate(-90 32 32)" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+c.toFixed(1)+'" data-off="'+off.toFixed(1)+'"/>'+
    '<text x="32" y="37" text-anchor="middle" class="ring-num">'+p+'%</text></svg>';
}
function heatHTML(b){
  const col=projectColor(b.projectKey), on=new Set(b.days);
  let s="";
  for(let d=0; d<MAXDAY; d++){
    const cls = on.has(d) ? ("on"+(d>=27?" now":"")) : "";
    s += '<i class="'+cls+'" style="--c:'+col+'"></i>';
  }
  return s;
}
function stepsHTML(b){
  return b.steps.map(([label,done])=>'<li class="'+(done?"done":"")+'"><span class="chk">'+(done?"\u2713":"\u25cb")+'</span>'+label+'</li>').join("");
}
function logHTML(b){
  return b.log.map(([when,what])=>'<li><span class="when">'+when+'</span><span class="what">'+what+'</span></li>').join("");
}
function cardHTML(k){
  const b=BRANCHES[k], col=projectColor(b.projectKey), ph=phase(b), open=state.open===k;
  const act=active7(b);
  return '<article class="branch'+(open?" open":"")+(b.needs?" needs":"")+(b.status==="stale"?" stale":"")+(k===state.selected?" sel":"")+'" data-card="'+k+'" style="--edge:'+col+'">'+
    '<div class="b-head">'+
      '<span class="b-dot" style="background:'+col+'"></span>'+
      '<span class="b-proj">'+b.project+'</span><span class="b-sep">/</span><span class="b-path">'+b.path+'</span>'+
      '<span class="b-age">'+(k===MOST_RECENT?'<span class="pulse"></span>':'')+b.age+'</span>'+
      '<span class="b-chev"><svg><use href="#chev"/></svg></span>'+
    '</div>'+
    '<div class="b-main">'+
      '<div class="b-left">'+
        '<h3 class="b-name">'+b.name+'</h3>'+
        '<div class="b-feature"><span class="tag '+ph[1]+'">'+ph[0]+'</span>'+b.feature+'</div>'+
        '<div class="b-activity"><div class="heat">'+heatHTML(b)+'</div>'+
          '<span class="b-act">'+(act>0?"active "+act+" of last 7 days":"quiet all week")+'</span></div>'+
        '<div class="b-note'+(b.noteHot?" hot":"")+'">'+b.note+'</div>'+
      '</div>'+
      '<div class="b-right">'+ringHTML(b)+
        '<div class="b-rlabel">'+(b.status==="merged"?"merged":"to main")+'</div>'+
        '<div class="b-steps">'+(b.status==="merged"?"shipped":doneCount(b)+" of "+b.steps.length+" steps")+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="b-expand"><div class="b-expand-inner"><div class="ex-wrap">'+
      '<div class="ex-grid">'+
        '<div><div class="ex-h">Steps to main</div><ul class="steps">'+stepsHTML(b)+'</ul></div>'+
        '<div><div class="ex-h">Your activity</div><ul class="log">'+logHTML(b)+'</ul></div>'+
      '</div>'+
      '<div class="ex-actions">'+
        '<button class="btn primary" data-act="resume">Resume</button>'+
        '<button class="btn ghost" data-act="ask">Ask the advisor</button>'+
        '<span class="ex-commits">'+b.commits+' commits \u00b7 '+b.days.length+' active days</span>'+
      '</div>'+
    '</div></div></div>'+
  '</article>';
}
function renderBoard(){
  let list=scoped();
  if(state.view==="needs") list=list.filter(k=>BRANCHES[k].needs);
  list.sort(byRank);
  const el=$("#board");
  if(!list.length){ el.innerHTML='<div class="empty">Nothing here.</div>'; return; }
  el.innerHTML=list.map(cardHTML).join("");
  requestAnimationFrame(()=>$$(".ring-fill").forEach(el=>{ el.style.strokeDashoffset=el.dataset.off; }));
}

/* ---------- timeline + notes (depth) ---------- */
function renderStrands(){
  const el=$("#strandsBig"), list=scoped().sort(byRank);
  el.innerHTML="";
  list.forEach(k=>{
    const b=BRANCHES[k], col=projectColor(b.projectKey);
    const row=document.createElement("div"); row.className="srow"+(b.status==="stale"?" faded":"");
    row.innerHTML='<div class="slabel"><div class="sname">'+b.name+'</div><div class="spath">'+b.feature+'</div></div>';
    const lane=document.createElement("div"); lane.className="slane";
    const today=document.createElement("div"); today.className="stoday"; today.style.left=(27.5/MAXDAY*100)+"%"; lane.appendChild(today);
    const sorted=[...b.days].sort((a,c)=>a-c);
    const bar=document.createElement("div"); bar.className="span-bar";
    bar.style.left=(sorted[0]/MAXDAY*100)+"%"; bar.style.width=((sorted[sorted.length-1]-sorted[0])/MAXDAY*100)+"%";
    bar.style.background=b.status==="merged"?"var(--sage)":col; lane.appendChild(bar);
    b.days.forEach(d=>{
      const dot=document.createElement("div"); dot.className="dot"+(d===sorted[sorted.length-1]?" big":"");
      dot.style.left=(d/MAXDAY*100)+"%"; dot.style.background=b.status==="merged"?"var(--sage)":col;
      dot.title=b.path+" \u00b7 "+(MAXDAY-d)+" days ago"; lane.appendChild(dot);
    });
    row.appendChild(lane); el.appendChild(row);
  });
}
function renderLegend(){
  $("#legend").innerHTML=Object.keys(PROJECTS).map(k=>'<span><i style="background:'+PROJECTS[k].color+'"></i>'+PROJECTS[k].name+'</span>').join("");
}
function renderNotes(){
  $("#notesGrid").innerHTML=scoped().sort(byRank).map(k=>{
    const b=BRANCHES[k], col=projectColor(b.projectKey);
    return '<article class="note-card" data-card="'+k+'">'+
      '<div class="nc-top"><span class="pdot" style="background:'+col+'"></span>'+b.project+'<span class="age">'+b.age+'</span></div>'+
      '<div class="q">'+b.note+'</div><p class="body">'+b.recall+'</p>'+
      '<div class="nc-meta">'+b.feature+' \u00b7 '+pct(b)+'% to main</div></article>';
  }).join("");
}

/* ---------- scope ---------- */
function renderProjTabs(){
  const counts={all:ORDER.length};
  ORDER.forEach(k=>{ counts[BRANCHES[k].projectKey]=(counts[BRANCHES[k].projectKey]||0)+1; });
  const items=[["all","All projects",null]].concat(Object.keys(PROJECTS).map(k=>[k,PROJECTS[k].name,PROJECTS[k].color]));
  $("#projTabs").innerHTML=items.map(([key,label,color])=>
    '<button class="ptab'+(state.project===key?" active":"")+'" data-project="'+key+'">'+
      (color?'<span class="pdot" style="background:'+color+'"></span>':'')+label+'<span class="n">'+counts[key]+'</span></button>').join("");
}
function updateCounts(){
  const list=scoped(), needs=list.filter(k=>BRANCHES[k].needs).length;
  const projCount=state.project==="all"?3:1;
  $("#countsLine").innerHTML='<b>'+list.length+'</b> branches across <b>'+projCount+'</b> project'+(projCount>1?'s':'')+' \u00b7 <b>'+needs+'</b> need you';
  $("#needsBadge").textContent=needs;
}
function updateCmdContext(){ $("#cmdCtx").textContent=BRANCHES[state.selected].path; }
function applyView(){
  $$("#viewTabs .vtab").forEach(t=>t.classList.toggle("active", t.dataset.view===state.view));
  const onBoard=state.view==="board"||state.view==="needs";
  $("#boardSection").classList.toggle("hidden", !onBoard);
  $("#timelineSection").classList.toggle("hidden", state.view!=="timeline");
  $("#notesSection").classList.toggle("hidden", state.view!=="notes");
}
function renderAll(){
  renderProjTabs(); renderLegend();
  const list=scoped();
  if(!list.includes(state.selected)) state.selected=list.slice().sort(byRank)[0]||"onboarding";
  renderBoard(); renderStrands(); renderNotes(); updateCounts(); updateCmdContext(); applyView();
}

/* ---------- advisor ---------- */
const COMPASS='<svg class="mark"><use href="#compass"/></svg>';
let thread;
function pushUser(t){ thread.insertAdjacentHTML("beforeend",'<div class="msg user">'+t+'</div>'); }
function pushBot(key,q){
  const b=BRANCHES[key];
  let body,label;
  if(q==="blocker"){ body=b.blocker; label="The blocker"; }
  else if(q==="next"){ body=b.next; label="What I'd do first"; }
  else if(q==="progress"){
    body="You are at "+pct(b)+"% to main \u2014 "+doneCount(b)+" of "+b.steps.length+" steps done. Still open: "+
      b.steps.filter(s=>!s[1]).map(s=>s[0]).join(", ")+".";
    label="Distance to main";
  } else { body=b.recall; label="Where you left off"; }
  thread.insertAdjacentHTML("beforeend",
    '<div class="msg bot"><div class="who">'+COMPASS+'Advisor \u00b7 '+label+'</div><p>'+body+'</p>'+
    '<div class="cite"><b>'+b.commits+' commits</b>\u00b7 <b>'+b.project+'</b> \u00b7 <span style="color:#c9d4e1">'+b.path+'</span></div></div>');
  thread.scrollTop=thread.scrollHeight;
}
function pushIntro(key){
  const b=BRANCHES[key];
  thread.insertAdjacentHTML("beforeend",
    '<div class="msg bot"><div class="who">'+COMPASS+'Advisor</div><p>I\u2019ve read <b style="color:#e9e6df">'+b.name+'</b> \u2014 '+
    b.feature+', '+b.commits+' commits, '+pct(b)+'% to main. Ask me where you left off, what\u2019s blocking, or how close to main.</p></div>');
}
function openPalette(key,q){
  selectBranch(key,true);
  const b=BRANCHES[key];
  $("#ctxPath").textContent=b.project+" / "+b.path;
  $("#ctxDot").style.background=projectColor(b.projectKey);
  $("#pFootCtx").textContent="grounded in "+b.commits+" commits \u00b7 "+b.days.length+" active days \u00b7 "+pct(b)+"% to main";
  thread=$("#thread"); thread.innerHTML="";
  pushIntro(key);
  if(q){ pushUser(labelFor(q)); pushBot(key,q); }
  document.body.classList.add("palette-open");
  setTimeout(()=>$("#advInput").focus(),40);
}
function closePalette(){ document.body.classList.remove("palette-open"); }
function labelFor(q){ return {recall:"Where did I leave off?",blocker:"What's blocking me?",next:"What should I do first?",progress:"How close to main?"}[q]||"Where did I leave off?"; }
function classify(t){
  t=t.toLowerCase();
  if(/close|progress|percent|ready|push|main|finish/.test(t)) return "progress";
  if(/block|stuck|wrong|fail|red|conflict/.test(t)) return "blocker";
  if(/first|next|should i|do now|start|move/.test(t)) return "next";
  return "recall";
}

/* ---------- selection + expand ---------- */
function selectBranch(key,quiet){
  state.selected=key;
  $$(".branch").forEach(c=>c.classList.toggle("sel", c.dataset.card===key));
  updateCmdContext();
  if(!quiet) $("#dashboard").animate([{opacity:.75},{opacity:1}],{duration:150,easing:"ease-out"});
}
function toggleCard(key){
  state.open = state.open===key ? null : key;
  $$(".branch").forEach(c=>c.classList.toggle("open", c.dataset.card===state.open));
  selectBranch(key);
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){ $("#toastMsg").textContent=msg; $("#toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>$("#toast").classList.remove("show"),2400); }

/* ---------- events ---------- */
$("#projTabs").addEventListener("click",e=>{ const t=e.target.closest("[data-project]"); if(!t)return; state.project=t.dataset.project; renderAll(); });
$("#viewTabs").addEventListener("click",e=>{ const t=e.target.closest("[data-view]"); if(!t)return; state.view=t.dataset.view; renderAll(); $("#dashboard").scrollTo({top:0,behavior:"smooth"}); });
$("#board").addEventListener("click",e=>{
  const act=e.target.closest("[data-act]");
  if(act){
    const key=act.closest("[data-card]").dataset.card;
    if(act.dataset.act==="ask") openPalette(key,"recall");
    else toast("Opening "+BRANCHES[key].path+" in your editor\u2026");
    return;
  }
  const card=e.target.closest("[data-card]");
  if(card) toggleCard(card.dataset.card);
});
$("#notesGrid").addEventListener("click",e=>{ const c=e.target.closest("[data-card]"); if(c) openPalette(c.dataset.card,"recall"); });
$("#paletteLayer").addEventListener("mousedown",e=>{ if(e.target.id==="paletteLayer") closePalette(); });
$("#cmdSearch").addEventListener("click",()=>openPalette(state.selected));
$("#fab").addEventListener("click",()=>openPalette(state.selected));
$("#advInput").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.value.trim()){ thread=$("#thread"); pushUser(e.target.value.trim()); pushBot(state.selected,classify(e.target.value)); e.target.value=""; }
});
document.querySelector(".p-chips").addEventListener("click",e=>{
  const c=e.target.closest("[data-q]"); if(!c)return; thread=$("#thread"); pushUser(c.textContent); pushBot(state.selected,c.dataset.q);
});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openPalette(state.selected); }
  if(e.key==="Escape") closePalette();
});

renderAll();
</script>
</body>
</html>
