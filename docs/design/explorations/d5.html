<!DOCTYPE html>
<!--
  D5 — THE CONSOLE
  Keyboard-first. One command line at the top; everything below is the ledger responding.
  The advisor's answers land as entries in the same stream, with the same time column and
  the same glyph gutter — an answer is a logbook entry, not a chat bubble.
-->
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bearing — D5 The Console</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="base.css">
<style>
  .shell { max-width: 1020px; margin: 0 auto; padding: 0 30px 150px; position: relative; z-index: 1; }
  .cmdbar { position: sticky; top: 0; z-index: 30; background: linear-gradient(180deg, var(--bg) 78%, transparent);
    padding: 18px 0 14px; }
  .cmd { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line-3); border-radius: 10px;
    background: var(--panel-2); padding: 12px 16px; transition: .15s; }
  .cmd:focus-within { border-color: #62c9c088; box-shadow: 0 0 0 4px #62c9c00f; }
  .cmd .caret { color: var(--now); font-family: var(--mono); font-size: 14px; }
  .cmd input { flex: 1; outline: 0; font-family: var(--mono); font-size: 14px; color: var(--text-hi); }
  .cmd input::placeholder { color: var(--muted); }
  .cmd .kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line-3); border-radius: 5px; padding: 2px 7px; color: var(--muted); }
  .hints { display: flex; gap: 6px; flex-wrap: wrap; padding: 9px 2px 0; }
  .hint { font-family: var(--mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line-2);
    border-radius: 6px; padding: 2px 9px; }
  .hint:hover { color: var(--text); border-color: var(--line-3); background: var(--panel-2); }
  .hint b { color: var(--now-dim); font-weight: 400; }

  .statline { display: flex; gap: 20px; font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    padding: 12px 2px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; flex-wrap: wrap; }
  .statline b { color: var(--body); font-weight: 500; }
  .statline .sp { margin-left: auto; }

  .log { padding-top: 10px; }
  .entry { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .entry .ehead { display: flex; align-items: baseline; gap: 12px; }
  .entry .et { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 46px; flex: none; }
  .entry .eq { font-family: var(--mono); font-size: 13.5px; color: var(--text-hi); }
  .entry .eq::before { content: "› "; color: var(--now); }
  .answer { padding-left: 58px; margin-top: 8px; }
  .answer .lede { font-family: var(--serif); font-size: 16px; line-height: 1.45; color: var(--text-hi); max-width: 62ch; }
  .answer .body { font-size: 13px; color: var(--body); max-width: 70ch; margin-top: 8px; line-height: 1.6; }
  .answer .tools { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .tool { font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--line-2);
    border-radius: 5px; padding: 1px 7px; }
  .tool.free { color: var(--good); border-color: #63c08a2a; }
  .tool.paid { color: var(--warn); border-color: #f2c9762a; }
  .cost { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-top: 8px; }

  .res { margin-top: 12px; padding-left: 58px; }
  .res .rrow { display: flex; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
  .res .rrow:hover { background: #ffffff05; }
  .res .bn { font-family: var(--mono); font-size: 12px; color: var(--text); width: 300px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .bn .r { color: var(--muted); }
  .res .tt { font-family: var(--serif); font-size: 14px; color: var(--text-hi); min-width: 0; }
  .res .tail { margin-left: auto; display: flex; gap: 8px; align-items: baseline; flex: none; }
  .typing { display: inline-block; width: 7px; height: 14px; background: var(--now); vertical-align: -2px; animation: bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity: 0 } }
</style></head>
<body>
<div class="shell">
  <div class="cmdbar">
    <div style="display:flex;align-items:baseline;gap:12px;padding-bottom:12px">
      <span class="brand" style="padding:0"><span class="word" style="font-family:var(--serif);font-style:italic;font-size:19px">Bearing</span></span>
      <span class="eyebrow">the console</span>
      <span style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)">read 13:42 UTC · 4738 calls left</span>
    </div>
    <div class="cmd"><span class="caret">›</span>
      <input id="q" placeholder="ask anything, or type a branch name" autofocus>
      <span class="kbd">⏎</span></div>
    <div class="hints" id="hints"></div>
  </div>
  <div class="statline" id="stat"></div>
  <div class="log" id="log"></div>
</div>
<div class="xbar" id="xbar"></div>
<script src="data.js"></script><script src="frame.js"></script>
<script>
const c = counts();
document.getElementById('stat').innerHTML =
  `<span><b>${c.branches}</b> branches</span><span><b>${c.active}</b> moving</span>
   <span style="color:var(--bad)"><b style="color:var(--bad)">${c.failing}</b> red</span>
   <span><b>${c.open}</b> PRs open</span><span><b>${c.quiet}</b> quiet</span><span><b>${c.folded}</b> folded</span>
   <span class="sp">${SNAP.llm.pending} awaiting a summary</span>`;

document.getElementById('hints').innerHTML = [
  ['what changed since Monday', 'free'], ['what is red', 'free'], ['show claude/', 'free'],
  ['why is the advisor branch blocked', 'paid'], ['what should I look at first', 'paid'],
].map(([t, k]) => `<button class="hint">${k === 'paid' ? '<b>✦</b> ' : ''}${t}</button>`).join('');

const ordered = active().sort(byRecency);
function rrow(b) {
  return `<div class="rrow">
    <span class="bn"><span class="r">${shortRepo(b.repoKey)}/</span>${b.name}</span>
    <span class="tt">${esc(b.title || b.commits[0].message)}</span>
    <span class="tail">
      ${b.ci.state !== 'none' ? `<span class="chip ci-${b.ci.state}">${b.ci.state}</span>` : ''}
      <span class="chip">↑${b.ahead} ↓${b.behind}</span>
      <span class="age">${age(b.lastActivity)}</span></span></div>`;
}

document.getElementById('log').innerHTML = `
  <div class="entry">
    <div class="ehead"><span class="et">13:43</span><span class="eq">what should I look at first</span></div>
    <div class="answer">
      <div class="lede">The advisor branch. Its CI has been red for two days and it is the only thing in your way.</div>
      <div class="body">Everything else is either moving or deliberately parked. <span class="mono">claude/ecstatic-hopper-bwbbdt</span> is 41 ahead with an open PR, and the failure is one test that reaches the real provider — it needs a stub, not a fix to the engine. <span class="mono">gui-updates</span> is the other decision waiting on you: eleven behind, and the picker it adds has since been rebuilt on another branch.</div>
      <div class="tools">
        <span class="tool free">read snapshot</span><span class="tool free">list branches ×9</span>
        <span class="tool free">read commits ×5</span><span class="tool paid">summarise ×1</span>
      </div>
      <div class="cost">4 tool calls · 1 model call · 2.1s · deepseek-v4.1-flash</div>
    </div>
  </div>

  <div class="entry">
    <div class="ehead"><span class="et">13:42</span><span class="eq">show claude/</span></div>
    <div class="answer"><div class="body" style="margin-top:0">7 branches match the literal prefix <span class="mono">claude/</span>. No model call — this is a search over the snapshot already on disk.</div></div>
    <div class="res">${threads().filter(b => b.name.startsWith('claude/')).sort(byRecency).map(rrow).join('')}</div>
  </div>

  <div class="entry">
    <div class="ehead"><span class="et">13:42</span><span class="eq">everything</span></div>
    <div class="res">${ordered.map(rrow).join('')}
      <div class="rrow" style="color:var(--muted);font-style:italic;font-size:12px">
        <span style="padding-left:2px">${c.quiet} quiet · ${c.folded} folded away · type <span class="mono">quiet</span> to unfold them</span></div>
    </div>
  </div>`;

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  const q = e.target.value; e.target.value = '';
  const el = document.createElement('div');
  el.className = 'entry';
  el.innerHTML = `<div class="ehead"><span class="et">13:44</span><span class="eq">${esc(q)}</span></div>
    <div class="answer"><div class="body" style="margin-top:0;color:var(--muted)">thinking<span class="typing"></span></div></div>`;
  document.getElementById('log').prepend(el);
});
</script></body></html>
