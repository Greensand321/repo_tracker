<!DOCTYPE html>
<!--
  D4 — THE BROADSHEET
  No navigation at all. A masthead, a leader column, and a standing register down the
  side. It answers "read me the state of everything" in one pass, like a morning paper —
  the only design here you could hand to someone else and have them understand it.
-->
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bearing — D4 The Broadsheet</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="base.css">
<style>
  .sheet { max-width: 1180px; margin: 0 auto; padding: 0 40px 140px; position: relative; z-index: 1; }
  .masthead { text-align: center; padding: 34px 0 14px; border-bottom: 3px double var(--line-3); }
  .masthead .word { font-family: var(--serif); font-style: italic; font-size: 46px; letter-spacing: -.01em; }
  .masthead .rule-line { font-family: var(--mono); font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--muted); margin-top: 6px; display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
  .dateline { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px;
    color: var(--muted); padding: 9px 0; border-bottom: 1px solid var(--line-2); }

  .cols { display: grid; grid-template-columns: 1fr 296px; gap: 0; }
  .leader { padding: 26px 40px 0 0; border-right: 1px solid var(--line-2); min-width: 0; }
  .side { padding: 26px 0 0 28px; }

  .lead-item { padding-bottom: 26px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
  .lead-item:last-child { border-bottom: 0; }
  .kicker { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
  .kicker.hot { color: var(--now); }
  .kicker.bad { color: var(--bad); }
  .lead-item h2 { font-family: var(--serif); font-weight: 600; font-size: 27px; line-height: 1.18;
    margin: 6px 0 8px; letter-spacing: -.012em; max-width: 24ch; }
  .lead-item.small h2 { font-size: 19px; max-width: 34ch; }
  .byline { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .byline b { color: var(--dim); font-weight: 400; }
  .body-copy { columns: 2; column-gap: 30px; column-rule: 1px solid var(--line); margin-top: 12px; }
  .lead-item.small .body-copy { columns: 1; }
  .body-copy p { margin: 0 0 9px; font-size: 13.5px; line-height: 1.62; color: var(--body); }
  .body-copy p:first-child::first-letter { font-family: var(--serif); font-size: 40px; float: left;
    line-height: .84; padding: 4px 8px 0 0; color: var(--now); }
  .lead-item.small .body-copy p:first-child::first-letter { font-size: inherit; float: none; padding: 0; color: inherit; font-family: inherit; }
  .quotes { border-left: 2px solid var(--line-3); padding-left: 14px; margin-top: 12px; }
  .quotes div { font-family: var(--mono); font-size: 11.5px; color: var(--dim); padding: 2px 0; }
  .quotes div b { color: var(--faint); font-weight: 400; display: inline-block; width: 82px; }

  .stand { margin-bottom: 26px; }
  .stand h3 { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); font-weight: 700; }
  .listing { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; font-family: var(--mono); font-size: 11px; border-bottom: 1px dotted var(--line); }
  .listing .nm { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .listing .v { margin-left: auto; flex: none; color: var(--muted); }
  .listing .v.up { color: var(--good); } .listing .v.dn { color: var(--bad); }
  .listing:hover .nm { color: var(--text); }
  .weather { font-family: var(--mono); font-size: 11px; line-height: 1.85; color: var(--muted); }
  .weather b { color: var(--body); font-weight: 500; }
  .side .ask { margin-bottom: 24px; }
  .folded { font-size: 11.5px; color: var(--muted); font-style: italic; line-height: 1.6; }
</style></head>
<body>
<div class="sheet">
  <div class="masthead">
    <div class="word">Bearing</div>
    <div class="rule-line" id="rules"></div>
  </div>
  <div class="dateline" id="dateline"></div>
  <div class="cols">
    <div class="leader" id="leader"></div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div class="xbar" id="xbar"></div>
<script src="data.js"></script><script src="frame.js"></script>
<script>
const c = counts(), n = nowThread();

document.getElementById('rules').innerHTML =
  `<span>${c.repos} repositories</span><span>${c.branches} branches</span><span>${c.commits} commits read</span><span>no. 214</span>`;
document.getElementById('dateline').innerHTML =
  `<span>Thursday, September 17, 2026 · 13:42 UTC</span>
   <span>${SNAP.rateLimit.remaining}/${SNAP.rateLimit.limit} calls remaining · next read 14:11</span>`;

function item(b, lead) {
  const kick = b === n ? '<span class="kicker hot">Happening now</span>'
    : b.ci.state === 'failing' ? '<span class="kicker bad">Red for two days</span>'
    : b.progress === 'done' ? '<span class="kicker">Finished</span>'
    : b.relevance === 'quiet' ? '<span class="kicker">Gone quiet</span>'
    : '<span class="kicker">In progress</span>';
  return `<article class="lead-item ${lead ? '' : 'small'}">
    ${kick}
    <h2>${esc(b.title || b.commits[0].message)}</h2>
    <div class="byline"><b>${b.repoKey}</b> · ${b.name} · ↑${b.ahead} ↓${b.behind} · ${ageLong(b.lastActivity)}
      ${b.pr ? ` · PR #${b.pr.number} ${b.pr.state}` : ''}${b.ci.state !== 'none' ? ` · CI ${b.ci.state}` : ''}</div>
    ${b.summary ? `<div class="body-copy"><p>${esc(b.summary)}</p>
      ${lead ? `<p>The ${b.commits.length} commits on this branch are all from ${b.commits[0].author}, the most recent ${age(b.lastActivity)} ago. Nothing here has been merged; the branch is ${b.behind === 0 ? 'level with main' : b.behind + ' behind main'}.</p>` : ''}</div>` : ''}
    ${lead ? `<div class="quotes">${b.commits.slice(0, 4).map(cm =>
      `<div><b>${cm.authoredAt.slice(5,10).replace('-','/')} ${clock(cm.authoredAt)}</b> ${esc(cm.message)}</div>`).join('')}</div>` : ''}
  </article>`;
}

const ordered = active().sort(byRecency);
document.getElementById('leader').innerHTML =
  item(ordered[0], true) + ordered.slice(1).map(b => item(b, false)).join('');

const all = threads().sort(byRecency);
document.getElementById('side').innerHTML = `
  <button class="ask"><span>Ask the advisor</span><span class="kbd">⌘K</span></button>
  <div class="stand"><h3>The register</h3>
    ${all.map(b => `<div class="listing">
      <span class="dot ${b.ci.state === 'failing' ? 'blocked' : b.progress === 'done' ? 'done' : b.relevance === 'quiet' ? 'quiet' : 'active'}"></span>
      <span class="nm">${b.name}</span>
      <span class="v ${b.behind > b.ahead ? 'dn' : 'up'}">${b.ahead}/${b.behind}</span>
      <span class="v" style="width:34px;text-align:right">${age(b.lastActivity)}</span></div>`).join('')}
  </div>
  <div class="stand"><h3>Conditions</h3>
    <div class="weather">
      <b>${c.active}</b> branches moving<br>
      <b>${c.failing}</b> with red CI<br>
      <b>${c.open}</b> pull requests open<br>
      <b>${c.quiet}</b> gone quiet<br>
      <b>${c.folded}</b> folded away, still tracked
    </div>
  </div>
  <div class="stand"><h3>Notices</h3>
    <div class="weather" style="color:var(--bad)">${SNAP.warnings.map(w => esc(w)).join('<br>')}</div>
    <div class="folded" style="margin-top:10px">${SNAP.llm.pending} branches are still waiting on a summary. They are listed above with their newest commit instead.</div>
  </div>`;
</script></body></html>
